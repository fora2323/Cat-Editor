name: Build Release

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'app/build.gradle.kts'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version Name
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -1 | sed 's/.*versionName = "\(.*\)".*/\1/')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Prepare APK & Extract Commit Metadata
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          ORIGINAL_APK="app/build/outputs/apk/release/app-release.apk"
          NEW_APK_NAME="app-release-${{ env.VERSION_NAME }}.apk"
          
          cp "$ORIGINAL_APK" "$NEW_APK_NAME"
          
          AUTHOR_NAME=$(git log -1 --format='%an')
          COMMIT_MSG=$(git log -1 --format='%B')
          
          DELIMITER="EOF_${SHORT_SHA}"
          
          echo "APK_PATH=$NEW_APK_NAME" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          
          echo "AUTHOR_NAME<<${DELIMITER}" >> $GITHUB_ENV
          echo "$AUTHOR_NAME" >> $GITHUB_ENV
          echo "${DELIMITER}" >> $GITHUB_ENV
          
          echo "COMMIT_MSG<<${DELIMITER}" >> $GITHUB_ENV
          echo "$COMMIT_MSG" >> $GITHUB_ENV
          echo "${DELIMITER}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install requests

      - name: Send Release APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          APK_PATH: ${{ env.APK_PATH }}
          SHORT_SHA: ${{ env.SHORT_SHA }}
          AUTHOR_NAME: ${{ env.AUTHOR_NAME }}
          COMMIT_MSG: ${{ env.COMMIT_MSG }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: python send_telegram_release.py

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Release ${{ env.VERSION_NAME }}
          body: |
            Version: ${{ env.VERSION_NAME }}
            Commit: ${{ env.SHORT_SHA }}
            Author: ${{ env.AUTHOR_NAME }}
            
            ${{ env.COMMIT_MSG }}
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
