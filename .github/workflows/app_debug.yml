name: Build & Send APK to Telegram

on:
  push:
    branches: [ "main", "master" ] # Sesuaikan dengan branch default kamu

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Prepare APK & Extract Commit Metadata
        run: |
          # 1. Ambil 7 karakter short SHA commit
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          # 2. Path output APK default Gradle
          ORIGINAL_APK="app/build/outputs/apk/debug/app-debug.apk"
          NEW_APK_NAME="app-debug-${SHORT_SHA}.apk"
          
          # 3. Rename file
          cp "$ORIGINAL_APK" "$NEW_APK_NAME"
          
          # 4. Ambil author commit dan commit message
          AUTHOR_NAME="${{ github.event.head_commit.author.name }}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          
          # Simpan ke env untuk dipakai di step curl
          echo "APK_PATH=$NEW_APK_NAME" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "AUTHOR_NAME=$AUTHOR_NAME" >> $GITHUB_ENV
          echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_ENV

      - name: Send APK to Telegram Topic
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: "-1003914493532"
          TOPIC_ID: "352"
        run: |
          # Buat format caption dengan rapi (Markdown)
          CAPTION=$(cat <<EOF
          🚀 *New Build Compiled!*
          
          👤 *Committer:* ${AUTHOR_NAME}
          🔖 *Commit ID:* \`${SHORT_SHA}\`
          💬 *Message:* ${COMMIT_MSG}
          EOF
          )

          # Kirim ke Telegram API
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F chat_id="${CHAT_ID}" \
            -F message_thread_id="${TOPIC_ID}" \
            -F document=@"${APK_PATH}" \
            -F caption="${CAPTION}" \
            -F parse_mode="Markdown"
